# ====================================================================
# config.ini - Configuracion del servicio ApiReconocimiento
# ====================================================================
# Si este archivo no existe, el servicio arranca con valores default.
# Despues de editar este archivo, REINICIA el servicio Python para que
# los cambios tomen efecto.
# ====================================================================


# ============================================
# [server] - Configuracion del servidor web
# ============================================
[server]

# Puerto donde escucha el servicio (default: 5000)
port = 5000

# IP donde escucha el servicio:
#   0.0.0.0   = acepta conexiones desde cualquier IP (default)
#               Usar si el MVC corre en otra maquina o servidor.
#   127.0.0.1 = solo acepta conexiones locales (mas seguro)
#               Usar si el MVC corre en la misma maquina.
host = 0.0.0.0


# ============================================
# [recognition] - Parametros de reconocimiento facial
# ============================================
[recognition]

# Umbral de similitud coseno (rango 0.0 - 1.0).
# Es el parametro MAS IMPORTANTE para calibrar el reconocimiento.
#
# Como funciona:
#   El servicio compara el rostro enviado con el embedding guardado.
#   Devuelve un valor de similitud entre 0 (totalmente distinto) y 1 (identico).
#   Si la similitud >= threshold => COINCIDE
#   Si la similitud < threshold => NO COINCIDE
#
# Valores tipicos:
#   0.30 = muy permisivo (riesgo de confundir personas parecidas)
#   0.35 = recomendado (default) - balance entre estrictez y tolerancia
#   0.40 = estricto (puede no reconocer al titular en mala luz/angulo)
#   0.45+ = muy estricto (solo coincide si las condiciones son ideales)
#
# Que ajustar:
#   - Si NO reconoce al titular legitimo => baja el threshold (ej: 0.30)
#   - Si reconoce a personas distintas como si fueran el titular => sube (ej: 0.40)
threshold = 0.35

# Tamanio de deteccion de InsightFace (en pixeles).
# Indica a que resolucion procesa internamente la imagen para detectar rostros.
#
#   320  = mas rapido, pero detecta peor rostros lejanos o pequenios
#   640  = balance recomendado (default) - bueno para fotos cara-a-cara
#   1280 = mas lento (~3x), pero detecta mejor rostros pequenios o lejanos
#
# No es necesario cambiar este valor a menos que los usuarios marquen
# desde lejos de la camara o haya problemas de deteccion.
det_size = 640


# ============================================
# [logging] - Configuracion de los logs
# ============================================
[logging]

# Nivel de detalle del archivo de log ApiReconocimientoInsightFace.log:
#   DEBUG   = muestra TODO (util cuando hay problemas, ocupa mucho disco)
#   INFO    = lo normal (default) - registra operaciones importantes
#   WARNING = solo registra advertencias y errores
#   ERROR   = solo registra errores graves
#
# Si tienes problemas de reconocimiento y necesitas diagnosticar,
# cambia a DEBUG temporalmente para ver mas detalle.
log_level = INFO
